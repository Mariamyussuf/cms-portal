<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- COLMANS Crest: College of Management Sciences -->
  <defs>
    <linearGradient id="colmansGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C2340"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="94" fill="url(#colmansGrad)" stroke="url(#goldAccent)" stroke-width="4"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#FFFFFF" stroke-dasharray="3,3" stroke-width="1.5"/>

  <!-- Pillars of Management & Analytics -->
  <rect x="58" y="90" width="14" height="48" rx="2" fill="url(#goldAccent)"/>
  <rect x="79" y="74" width="14" height="64" rx="2" fill="#FFFFFF"/>
  <rect x="100" y="60" width="14" height="78" rx="2" fill="url(#goldAccent)"/>
  <rect x="121" y="80" width="14" height="58" rx="2" fill="#FFFFFF"/>

  <!-- Pedestal Base -->
  <rect x="50" y="138" width="100" height="8" rx="2" fill="url(#goldAccent)"/>

  <!-- Star / Compass at Top -->
  <polygon points="100,28 104,40 116,40 106,48 110,60 100,52 90,60 94,48 84,40 96,40" fill="#FDE047"/>

  <!-- Text -->
  <text x="100" y="168" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">
    COLMANS
  </text>
  <text x="100" y="180" fill="#F59E0B" font-family="Arial, Helvetica, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle" letter-spacing="0.8">
    MANAGEMENT SCIENCES
  </text>
</svg>
